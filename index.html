<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>Frontend Mentor | Order summary card</title>
  <link rel="stylesheet" href="./style/style.css">

</head>
<body>
  <section>
    <figure>
      <img src="./images/illustration-hero.svg" alt="">
    </figure>

    <summary>
      <h1>Resumo do Pedido</h1>
      <p>Você pode agora escutar milhares de sons, audiobooks e podcasts em qualquer dispositivo e aonda voce quiser!</p>
    </summary>

    <div class="info">
      <img src="./images/icon-music.svg" alt="">

      <div class="info-plano">
        <h3>Plano Anual</h3>
        <span>$69.99/ano</span>
      </div>


      <a href="">Mudar</a>

    </div>
    
    <div class="buttons">
      <button>Prosseguir para Pagamento</button>
      <button class="button-cancelar">Cancelar Pedido</button>
    </div>
  </section>
</body>
</html>
